name: Tally
options:
  bundleIdPrefix: dev.sdkbump.fixtures
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  Tally:
    type: application
    platform: iOS
    sources:
      - Tally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sdkbump.fixtures.tally
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: Tally
        INFOPLIST_FILE: Tally/Info.plist
