# Copy to .github/workflows/sdkbump.yml in an app repository. On every pull request that changes
# the iOS app, the sdkbump report is added to the job summary and kept as an artifact, and the job
# fails when sdkbump finds something that stops the app at launch or blanks its screen (errors).
# Add `--fail-on warning` to fail on warnings too, or `--fail-on none` to report only.
#
# The job runs the latest 0.1 release of the npm package @mcamdali/sdkbump (the command is sdkbump).
# To run one fixed release instead, put its GitHub release tarball in place of @mcamdali/sdkbump@0.1,
# e.g. https://github.com/muhittincamdali/sdkbump/releases/download/v0.1.4/sdkbump-0.1.4.tgz.
name: sdkbump

on:
  pull_request:
    paths:
      - 'ios/**'
      - '*.xcodeproj/**'
      - '**/Info.plist'
      - '**/*.swift'
      - '**/*.m'
      - 'package.json'
      - 'app.json'
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # Ends the job if a run waits on something in the checked repository, instead of GitHub's
    # default limit of six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check for the iOS 27 SDK changes
        run: |
          status=0
          npx --yes @mcamdali/sdkbump@0.1 \
            --format markdown --output sdkbump.md || status=$?
          # Exit code 2 (the project could not be read) can come without a report.
          if [ -f sdkbump.md ]; then
            cat sdkbump.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "sdkbump exited with $status and wrote no report; see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sdkbump-report
          path: sdkbump.md
          if-no-files-found: ignore
