an class="t" style="animation-delay:1.93s">t</tspan><tspan class="t" style="animation-delay:1.98s">t</tspan><tspan class="t" style="animation-delay:2.02s">e</tspan><tspan class="t" style="animation-delay:2.06s">r</tspan><tspan class="t" style="animation-delay:2.11s">-</tspan><tspan class="t" style="animation-delay:2.15s">c</tspan><tspan class="t" style="animation-delay:2.20s">u</tspan><tspan class="t" style="animation-delay:2.25s">s</tspan><tspan class="t" style="animation-delay:2.29s">t</tspan><tspan class="t" style="animation-delay:2.33s">o</tspan><tspan class="t" style="animation-delay:2.38s">m</tspan><tspan class="t" style="animation-delay:2.42s">-</tspan><tspan class="t" style="animation-delay:2.47s">a</tspan><tspan class="t" style="animation-delay:2.51s">p</tspan><tspan class="t" style="animation-delay:2.56s">p</tspan><tspan class="t" style="animation-delay:2.60s">d</tspan><tspan class="t" style="animation-delay:2.65s">e</tspan><tspan class="t" style="animation-delay:2.69s">l</tspan><tspan class="t" style="animation-delay:2.74s">e</tspan><tspan class="t" style="animation-delay:2.78s">g</tspan><tspan class="t" style="animation-delay:2.83s">a</tspan><tspan class="t" style="animation-delay:2.88s">t</tspan><tspan class="t" style="animation-delay:2.92s">e</tspan></tspan></text>
<text class="t" x="20" y="105" style="animation-delay:3.46s"><tspan fill="#5A6B80">sdkbump 0.1.2 · rules ios27@2026.10.15 · iOS 27.0 SDK (Xcode 27.0, 27A266a)</tspan></text>
<text class="t" x="20" y="124" style="animation-delay:3.50s"></text>
<text class="t" x="20" y="143" style="animation-delay:3.53s"><tspan fill="#00285C" font-weight="700">flutter_custom</tspan><tspan fill="#0B1F33"> · Flutter · fixtures/flutter-custom-appdelegate</tspan></text>
<text class="t" x="20" y="162" style="animation-delay:3.57s"><tspan fill="#5A6B80">flutter (unknown) (not pinned)</tspan></text>
<text class="t" x="20" y="181" style="animation-delay:3.60s"><tspan fill="#5A6B80">target Runner: app delegate life cycle (ios/Runner/Info.plist)</tspan></text>
<text class="t" x="20" y="200" style="animation-delay:3.64s"></text>
<text class="t" x="20" y="219" style="animation-delay:3.67s"><tspan fill="#00285C" font-weight="700">Fails to launch when built with the iOS 27 SDK.</tspan></text>
<text class="t" x="20" y="238" style="animation-delay:3.71s"></text>
<text class="t" x="20" y="257" style="animation-delay:3.75s"><tspan fill="#00285C" font-weight="700">ERROR    </tspan><tspan fill="#00285C" font-weight="700">SCN001 No scene configuration</tspan></text>
<text class="t" x="20" y="276" style="animation-delay:3.78s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0071E3">ios/Runner/Info.plist</tspan></text>
<text class="t" x="20" y="295" style="animation-delay:3.81s"><tspan fill="#0B1F33">         Info.plist has no UIApplicationSceneManifest, and AppDelegate does not implement</tspan></text>
<text class="t" x="20" y="314" style="animation-delay:3.85s"><tspan fill="#0B1F33">         application(_:configurationForConnecting:options:). Built with the iOS 27 SDK, the app</tspan></text>
<text class="t" x="20" y="333" style="animation-delay:3.88s"><tspan fill="#0B1F33">         stops at launch: "UIScene life cycle is required for apps built with this SDK". Flutter</tspan></text>
<text class="t" x="20" y="352" style="animation-delay:3.92s"><tspan fill="#0B1F33">         will not migrate it automatically: ios/Runner/AppDelegate.swift differs from the templates</tspan></text>
<text class="t" x="20" y="371" style="animation-delay:3.96s"><tspan fill="#0B1F33">         Flutter migrates.</tspan></text>
<text class="t" x="20" y="390" style="animation-delay:3.99s"><tspan fill="#0B1F33">         </tspan><tspan fill="#00285C" font-weight="700">Fix: [A] Migrate the Flutter app by hand</tspan></text>
<text class="t" x="20" y="409" style="animation-delay:4.03s"></text>
<text class="t" x="20" y="428" style="animation-delay:4.06s"><tspan fill="#0058D4" font-weight="700">WARNING  </tspan><tspan fill="#00285C" font-weight="700">SCN003 application(_:open:options:) is not called with scenes</tspan></text>
<text class="t" x="20" y="447" style="animation-delay:4.09s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0071E3">ios/Runner/AppDelegate.swift:28</tspan></text>
<text class="t" x="20" y="466" style="animation-delay:4.13s"><tspan fill="#0B1F33">         UIKit does not call this method once the app uses scenes. Use scene(_:openURLContexts:),</tspan></text>
<text class="t" x="20" y="485" style="animation-delay:4.17s"><tspan fill="#0B1F33">         and connectionOptions.urlContexts in scene(_:willConnectTo:options:) for a link that</tspan></text>
<text class="t" x="20" y="504" style="animation-delay:4.20s"><tspan fill="#0B1F33">         launches the app.</tspan></text>
<text class="t" x="20" y="523" style="animation-delay:4.23s"><tspan fill="#0B1F33">         </tspan><tspan fill="#00285C" font-weight="700">Fix: [B] Handle it in a FlutterSceneDelegate subclass</tspan></text>
<text class="t" x="20" y="542" style="animation-delay:4.27s"></text>
<text class="t" x="20" y="561" style="animation-delay:4.30s"><tspan fill="#0058D4" font-weight="700">WARNING  </tspan><tspan fill="#00285C" font-weight="700">SCN004 Root view controller read from the app delegate's window</tspan></text>
<text class="t" x="20" y="580" style="animation-delay:4.34s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0071E3">ios/Runner/AppDelegate.swift:10</tspan></text>
<text class="t" x="20" y="599" style="animation-delay:4.38s"><tspan fill="#0B1F33">         UIKit does not set the app delegate's window once a scene owns the window, and</tspan></text>
<text class="t" x="20" y="618" style="animation-delay:4.41s"><tspan fill="#0B1F33">         application(_:didFinishLaunchingWithOptions:) runs before any scene connects; reading its</tspan></text>
<text class="t" x="20" y="637" style="animation-delay:4.45s"><tspan fill="#0B1F33">         root view controller finds nil, and a forced cast of it crashes.</tspan></text>
<text class="t" x="20" y="656" style="animation-delay:4.48s"><tspan fill="#0B1F33">         </tspan><tspan fill="#00285C" font-weight="700">Fix: [C] Create channels from the engine bridge</tspan></text>
<text class="t" x="20" y="675" style="animation-delay:4.51s"></text>
<text class="t" x="20" y="694" style="animation-delay:4.55s"><tspan fill="#0058D4" font-weight="700">WARNING  </tspan><tspan fill="#00285C" font-weight="700">SCN004 Root view controller read from the app delegate's window</tspan></text>
<text class="t" x="20" y="713" style="animation-delay:4.58s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0071E3">ios/Runner/AppDelegate.swift:34</tspan></text>
<text class="t" x="20" y="732" style="animation-delay:4.62s"><tspan fill="#0B1F33">         UIKit does not set the app delegate's window once a scene owns the window, and</tspan></text>
<text class="t" x="20" y="751" style="animation-delay:4.66s"><tspan fill="#0B1F33">         application(_:didFinishLaunchingWithOptions:) runs before any scene connects; reading its</tspan></text>
<text class="t" x="20" y="770" style="animation-delay:4.69s"><tspan fill="#0B1F33">         root view controller finds nil, and a forced cast of it crashes.</tspan></text>
<text class="t" x="20" y="789" style="animation-delay:4.72s"><tspan fill="#0B1F33">         </tspan><tspan fill="#00285C" font-weight="700">Fix: [C] Create channels from the engine bridge</tspan></text>
<text class="t" x="20" y="808" style="animation-delay:4.76s"></text>
<text class="t" x="20" y="827" style="animation-delay:4.79s"><tspan fill="#00285C" font-weight="700">How to fix</tspan></text>
<text class="t" x="20" y="846" style="animation-delay:4.83s"></text>
<text class="t" x="20" y="865" style="animation-delay:4.87s"><tspan fill="#00285C" font-weight="700">[A]      </tspan><tspan fill="#00285C" font-weight="700">Migrate the Flutter app by hand</tspan></text>
<text class="t" x="20" y="884" style="animation-delay:4.90s"><tspan fill="#0B1F33">         1. Conform AppDelegate to FlutterImplicitEngineDelegate and move</tspan></text>
<text class="t" x="20" y="903" style="animation-delay:4.94s"><tspan fill="#0B1F33">            GeneratedPluginRegistrant.register, method channels and platform views into</tspan></text>
<text class="t" x="20" y="922" style="animation-delay:4.97s"><tspan fill="#0B1F33">            didInitializeImplicitFlutterEngine(_:).</tspan></text>
<text class="t" x="20" y="941" style="animation-delay:5.00s"><tspan fill="#0B1F33">         2. Add UIApplicationSceneManifest to ios/Runner/Info.plist with a configuration whose</tspan></text>
<text class="t" x="20" y="960" style="animation-delay:5.04s"><tspan fill="#0B1F33">            UISceneDelegateClassName is FlutterSceneDelegate and UISceneStoryboardFile is Main.</tspan></text>
<text class="t" x="20" y="979" style="animation-delay:5.08s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://github.com/muhittincamdali/sdkbump/blob/main/docs/guides/flutter.md</tspan></text>
<text class="t" x="20" y="998" style="animation-delay:5.11s"></text>
<text class="t" x="20" y="1017" style="animation-delay:5.14s"><tspan fill="#00285C" font-weight="700">[B]      </tspan><tspan fill="#00285C" font-weight="700">Handle it in a FlutterSceneDelegate subclass</tspan></text>
<text class="t" x="20" y="1036" style="animation-delay:5.18s"><tspan fill="#0B1F33">         1. Create SceneDelegate: FlutterSceneDelegate, name it in UISceneDelegateClassName, and</tspan></text>
<text class="t" x="20" y="1055" style="animation-delay:5.21s"><tspan fill="#0B1F33">            override the scene delegate method named in the finding, calling super so plugins still</tspan></text>
<text class="t" x="20" y="1074" style="animation-delay:5.25s"><tspan fill="#0B1F33">            receive the event.</tspan></text>
<text class="t" x="20" y="1093" style="animation-delay:5.29s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://github.com/muhittincamdali/sdkbump/blob/main/docs/guides/flutter.md</tspan></text>
<text class="t" x="20" y="1112" style="animation-delay:5.32s"></text>
<text class="t" x="20" y="1131" style="animation-delay:5.36s"><tspan fill="#00285C" font-weight="700">[C]      </tspan><tspan fill="#00285C" font-weight="700">Create channels from the engine bridge</tspan></text>
<text class="t" x="20" y="1150" style="animation-delay:5.39s"><tspan fill="#0B1F33">         1. Create method channels in didInitializeImplicitFlutterEngine(_:) with</tspan></text>
<text class="t" x="20" y="1169" style="animation-delay:5.42s"><tspan fill="#0B1F33">            engineBridge.applicationRegistrar.messenger() instead of reading</tspan></text>
<text class="t" x="20" y="1188" style="animation-delay:5.46s"><tspan fill="#0B1F33">            window?.rootViewController.</tspan></text>
<text class="t" x="20" y="1207" style="animation-delay:5.50s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://github.com/muhittincamdali/sdkbump/blob/main/docs/guides/flutter.md</tspan></text>
<text class="t" x="20" y="1226" style="animation-delay:5.53s"></text>
<text class="t" x="20" y="1245" style="animation-delay:5.56s"><tspan fill="#00285C" font-weight="700">1 error, 3 warnings</tspan></text>
<text class="t" x="20" y="1264" style="animation-delay:5.60s"><tspan fill="#0B1F33">Guide: https://github.com/muhittincamdali/sdkbump/blob/main/docs/guides/flutter.md</tspan></text>
<text class="t" x="20" y="1283" style="animation-delay:5.83s"><tspan fill="#0071E3" font-weight="700">$ </tspan></text>
<rect class="caret" x="35.66" y="1271" width="7.83" height="16" fill="#0071E3" style="animation-delay:5.83s"/>
