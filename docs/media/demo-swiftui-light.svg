an class="t" style="animation-delay:1.93s">i</tspan></tspan></text>
<text class="t" x="20" y="105" style="animation-delay:2.48s"><tspan fill="#5A6B80">sdkbump 0.1.0 · rules ios27@2026.10.15 · iOS 27.0 SDK (Xcode 27.0, 27A266a)</tspan></text>
<text class="t" x="20" y="124" style="animation-delay:2.51s"></text>
<text class="t" x="20" y="143" style="animation-delay:2.54s"><tspan fill="#00285C" font-weight="700">Tally</tspan><tspan fill="#0B1F33"> · native iOS · fixtures/native-swiftui</tspan></text>
<text class="t" x="20" y="162" style="animation-delay:2.58s"><tspan fill="#5A6B80">target Tally: SwiftUI App (scenes) (Tally/Info.plist)</tspan></text>
<text class="t" x="20" y="181" style="animation-delay:2.62s"></text>
<text class="t" x="20" y="200" style="animation-delay:2.65s"><tspan fill="#0058D4" font-weight="700">Launches; 3 findings to review.</tspan></text>
<text class="t" x="20" y="219" style="animation-delay:2.69s"></text>
<text class="t" x="20" y="238" style="animation-delay:2.72s"><tspan fill="#0058D4" font-weight="700">WARNING  </tspan><tspan fill="#00285C" font-weight="700">SCN003 application(_:open:options:) is not called with scenes</tspan></text>
<text class="t" x="20" y="257" style="animation-delay:2.75s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0071E3">Tally/TallyApp.swift:26</tspan></text>
<text class="t" x="20" y="276" style="animation-delay:2.79s"><tspan fill="#0B1F33">         A SwiftUI App runs on scenes, so UIKit does not call this method on the adaptor delegate.</tspan></text>
<text class="t" x="20" y="295" style="animation-delay:2.83s"><tspan fill="#0B1F33">         Use .onOpenURL instead.</tspan></text>
<text class="t" x="20" y="314" style="animation-delay:2.86s"><tspan fill="#0B1F33">         </tspan><tspan fill="#00285C" font-weight="700">Fix: [A] Use the SwiftUI scene API</tspan></text>
<text class="t" x="20" y="333" style="animation-delay:2.90s"></text>
<text class="t" x="20" y="352" style="animation-delay:2.93s"><tspan fill="#0058D4" font-weight="700">WARNING  </tspan><tspan fill="#00285C" font-weight="700">SCN003 applicationDidEnterBackground(_:) is not called with scenes</tspan></text>
<text class="t" x="20" y="371" style="animation-delay:2.97s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0071E3">Tally/TallyApp.swift:35</tspan></text>
<text class="t" x="20" y="390" style="animation-delay:3.00s"><tspan fill="#0B1F33">         A SwiftUI App runs on scenes, so UIKit does not call this method on the adaptor delegate.</tspan></text>
<text class="t" x="20" y="409" style="animation-delay:3.04s"><tspan fill="#0B1F33">         Use scenePhase instead.</tspan></text>
<text class="t" x="20" y="428" style="animation-delay:3.07s"><tspan fill="#0B1F33">         </tspan><tspan fill="#00285C" font-weight="700">Fix: [A] Use the SwiftUI scene API</tspan></text>
<text class="t" x="20" y="447" style="animation-delay:3.11s"></text>
<text class="t" x="20" y="466" style="animation-delay:3.14s"><tspan fill="#0058D4" font-weight="700">WARNING  </tspan><tspan fill="#00285C" font-weight="700">SCN004 Window looked up through UIApplication.windows</tspan></text>
<text class="t" x="20" y="485" style="animation-delay:3.18s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0071E3">Tally/ContentView.swift:38</tspan></text>
<text class="t" x="20" y="504" style="animation-delay:3.21s"><tspan fill="#0B1F33">         windows lists the windows of every scene (deprecated in iOS 15); use the windows of the</tspan></text>
<text class="t" x="20" y="523" style="animation-delay:3.25s"><tspan fill="#0B1F33">         relevant UIWindowScene.</tspan></text>
<text class="t" x="20" y="542" style="animation-delay:3.28s"><tspan fill="#0B1F33">         </tspan><tspan fill="#00285C" font-weight="700">Fix: [B] Find the window through the scene</tspan></text>
<text class="t" x="20" y="561" style="animation-delay:3.32s"></text>
<text class="t" x="20" y="580" style="animation-delay:3.35s"><tspan fill="#00285C" font-weight="700">How to fix</tspan></text>
<text class="t" x="20" y="599" style="animation-delay:3.39s"></text>
<text class="t" x="20" y="618" style="animation-delay:3.42s"><tspan fill="#00285C" font-weight="700">[A]      </tspan><tspan fill="#00285C" font-weight="700">Use the SwiftUI scene API</tspan></text>
<text class="t" x="20" y="637" style="animation-delay:3.46s"><tspan fill="#0B1F33">         1. A SwiftUI App always runs on scenes, so UIKit never calls this app delegate method. Use</tspan></text>
<text class="t" x="20" y="656" style="animation-delay:3.49s"><tspan fill="#0B1F33">            the SwiftUI replacement named in the finding on a view in your WindowGroup.</tspan></text>
<text class="t" x="20" y="675" style="animation-delay:3.53s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://github.com/muhittincamdali/sdkbump/blob/main/docs/guides/native-ios.md</tspan></text>
<text class="t" x="20" y="694" style="animation-delay:3.56s"></text>
<text class="t" x="20" y="713" style="animation-delay:3.60s"><tspan fill="#00285C" font-weight="700">[B]      </tspan><tspan fill="#00285C" font-weight="700">Find the window through the scene</tspan></text>
<text class="t" x="20" y="732" style="animation-delay:3.63s"><tspan fill="#0B1F33">         1. From a view or view controller, use view.window or view.window?.windowScene.</tspan></text>
<text class="t" x="20" y="751" style="animation-delay:3.67s"><tspan fill="#0B1F33">         2. Elsewhere, pick the foreground UIWindowScene from UIApplication.shared.connectedScenes</tspan></text>
<text class="t" x="20" y="770" style="animation-delay:3.70s"><tspan fill="#0B1F33">            and use its keyWindow or windows.</tspan></text>
<text class="t" x="20" y="789" style="animation-delay:3.74s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://github.com/muhittincamdali/sdkbump/blob/main/docs/guides/native-ios.md</tspan></text>
<text class="t" x="20" y="808" style="animation-delay:3.77s"></text>
<text class="t" x="20" y="827" style="animation-delay:3.81s"><tspan fill="#00285C" font-weight="700">0 errors, 3 warnings</tspan></text>
<text class="t" x="20" y="846" style="animation-delay:3.84s"><tspan fill="#0B1F33">Guide: https://github.com/muhittincamdali/sdkbump/blob/main/docs/guides/native-ios.md</tspan></text>
