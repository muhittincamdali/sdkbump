<text class="t" x="20" y="105" style="animation-delay:2.92s"><tspan fill="#8FA3BC">sdkbump 0.1.3 · rules ios27@2026.10.27 · iOS 27.0 SDK (Xcode 27.0, 27A266a)</tspan></text>
<text class="t" x="20" y="124" style="animation-delay:2.96s"></text>
<text class="t" x="20" y="143" style="animation-delay:2.99s"><tspan fill="#FFFFFF" font-weight="700">Tally</tspan><tspan fill="#D0E2F7"> · native iOS · fixtures/native-swiftui</tspan></text>
<text class="t" x="20" y="162" style="animation-delay:3.03s"><tspan fill="#8FA3BC">target Tally: SwiftUI App (scenes) (Tally/Info.plist)</tspan></text>
<text class="t" x="20" y="181" style="animation-delay:3.06s"></text>
<text class="t" x="20" y="200" style="animation-delay:3.10s"><tspan fill="#8CC4FF" font-weight="700">Launches; 3 findings to review.</tspan></text>
<text class="t" x="20" y="219" style="animation-delay:3.13s"></text>
<text class="t" x="20" y="238" style="animation-delay:3.17s"><tspan fill="#8CC4FF" font-weight="700">WARNING  </tspan><tspan fill="#FFFFFF" font-weight="700">SCN003 application(_:open:options:) is not called with scenes</tspan></text>
<text class="t" x="20" y="257" style="animation-delay:3.21s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#64D2FF">Tally/TallyApp.swift:26</tspan></text>
<text class="t" x="20" y="276" style="animation-delay:3.24s"><tspan fill="#D0E2F7">         A SwiftUI App runs on scenes, so UIKit does not call this method on the adaptor delegate.</tspan></text>
<text class="t" x="20" y="295" style="animation-delay:3.27s"><tspan fill="#D0E2F7">         Use .onOpenURL instead.</tspan></text>
<text class="t" x="20" y="314" style="animation-delay:3.31s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#FFFFFF" font-weight="700">Fix: [A] Use the SwiftUI scene API</tspan></text>
<text class="t" x="20" y="333" style="animation-delay:3.34s"></text>
<text class="t" x="20" y="352" style="animation-delay:3.38s"><tspan fill="#8CC4FF" font-weight="700">WARNING  </tspan><tspan fill="#FFFFFF" font-weight="700">SCN003 applicationDidEnterBackground(_:) is not called with scenes</tspan></text>
<text class="t" x="20" y="371" style="animation-delay:3.42s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#64D2FF">Tally/TallyApp.swift:35</tspan></text>
<text class="t" x="20" y="390" style="animation-delay:3.45s"><tspan fill="#D0E2F7">         A SwiftUI App runs on scenes, so UIKit does not call this method on the adaptor delegate.</tspan></text>
<text class="t" x="20" y="409" style="animation-delay:3.48s"><tspan fill="#D0E2F7">         Use scenePhase instead.</tspan></text>
<text class="t" x="20" y="428" style="animation-delay:3.52s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#FFFFFF" font-weight="700">Fix: [A] Use the SwiftUI scene API</tspan></text>
<text class="t" x="20" y="447" style="animation-delay:3.55s"></text>
<text class="t" x="20" y="466" style="animation-delay:3.59s"><tspan fill="#8CC4FF" font-weight="700">WARNING  </tspan><tspan fill="#FFFFFF" font-weight="700">SCN004 Window looked up through UIApplication.windows</tspan></text>
<text class="t" x="20" y="485" style="animation-delay:3.63s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#64D2FF">Tally/ContentView.swift:38</tspan></text>
<text class="t" x="20" y="504" style="animation-delay:3.66s"><tspan fill="#D0E2F7">         windows lists the windows of every scene (deprecated in iOS 15); use the windows of the</tspan></text>
<text class="t" x="20" y="523" style="animation-delay:3.69s"><tspan fill="#D0E2F7">         relevant UIWindowScene.</tspan></text>
<text class="t" x="20" y="542" style="animation-delay:3.73s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#FFFFFF" font-weight="700">Fix: [B] Find the window through the scene</tspan></text>
<text class="t" x="20" y="561" style="animation-delay:3.76s"></text>
<text class="t" x="20" y="580" style="animation-delay:3.80s"><tspan fill="#FFFFFF" font-weight="700">How to fix</tspan></text>
<text class="t" x="20" y="599" style="animation-delay:3.83s"></text>
<text class="t" x="20" y="618" style="animation-delay:3.87s"><tspan fill="#FFFFFF" font-weight="700">[A]      </tspan><tspan fill="#FFFFFF" font-weight="700">Use the SwiftUI scene API</tspan></text>
<text class="t" x="20" y="637" style="animation-delay:3.90s"><tspan fill="#D0E2F7">         1. A SwiftUI App always runs on scenes, so UIKit never calls this app delegate method. Use</tspan></text>
<text class="t" x="20" y="656" style="animation-delay:3.94s"><tspan fill="#D0E2F7">            the SwiftUI replacement named in the finding on a view in your WindowGroup.</tspan></text>
<text class="t" x="20" y="675" style="animation-delay:3.97s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/sdkbump/blob/main/docs/guides/native-ios.md</tspan></text>
<text class="t" x="20" y="694" style="animation-delay:4.01s"></text>
<text class="t" x="20" y="713" style="animation-delay:4.04s"><tspan fill="#FFFFFF" font-weight="700">[B]      </tspan><tspan fill="#FFFFFF" font-weight="700">Find the window through the scene</tspan></text>
<text class="t" x="20" y="732" style="animation-delay:4.08s"><tspan fill="#D0E2F7">         1. From a view or view controller, use view.window or view.window?.windowScene.</tspan></text>
<text class="t" x="20" y="751" style="animation-delay:4.12s"><tspan fill="#D0E2F7">         2. Elsewhere, pick the foreground UIWindowScene from UIApplication.shared.connectedScenes</tspan></text>
<text class="t" x="20" y="770" style="animation-delay:4.15s"><tspan fill="#D0E2F7">            and use its keyWindow or windows.</tspan></text>
<text class="t" x="20" y="789" style="animation-delay:4.19s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/sdkbump/blob/main/docs/guides/native-ios.md</tspan></text>
<text class="t" x="20" y="808" style="animation-delay:4.22s"></text>
<text class="t" x="20" y="827" style="animation-delay:4.25s"><tspan fill="#FFFFFF" font-weight="700">0 errors, 3 warnings</tspan></text>
<text class="t" x="20" y="846" style="animation-delay:4.29s"><tspan fill="#D0E2F7">Guide: https://github.com/muhittincamdali/sdkbump/blob/main/docs/guides/native-ios.md</tspan></text>
